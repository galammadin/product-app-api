<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            margin-bottom: 20px;
        }
        .search-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        #productTags {
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Product Management</h1>
            <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        </div>

        <!-- Search and Filter Section -->
        <div class="search-section">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="tagFilter" class="form-select">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchProducts()">Search</button>
                </div>
            </div>
        </div>

        <!-- Add Product Button -->
        <button class="btn btn-success mb-4" data-bs-toggle="modal" data-bs-target="#addProductModal">
            Add New Product
        </button>

        <!-- Products List -->
        <div class="row" id="productsList">
            <!-- Products will be dynamically added here -->
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="productTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" class="form-control" id="productPrice" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="productCategory" required>
                                <!-- Categories will be loaded here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tags</label>
                            <select class="form-select" id="productTags" multiple>
                                <!-- Tags will be loaded here -->
                            </select>
                            <small class="text-muted">Hold Ctrl (Windows) or Command (Mac) to select multiple tags</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addProduct()">Add Product</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API endpoints
        const API_BASE_URL = '/api/product';

        // Check if user is authenticated
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/api/product/login/';
                return false;
            }
            return true;
        }

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/api/product/login/';
        }

        // Fetch and display products
        async function fetchProducts() {
            if (!checkAuth()) return;

            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${API_BASE_URL}/products/`, {
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });

                if (response.status === 401) {
                    // Token expired or invalid
                    localStorage.removeItem('token');
                    window.location.href = '/api/product/login/';
                    return;
                }

                const products = await response.json();
                displayProducts(products);
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        // Display products in the UI
        function displayProducts(products) {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = '';

            products.forEach(product => {
                const productCard = `
                    <div class="col-md-4">
                        <div class="card product-card">
                            <div class="card-body">
                                <h5 class="card-title">${product.title}</h5>
                                <p class="card-text">${product.description}</p>
                                <p class="card-text">
                                    <small class="text-muted">
                                        Price: $${product.price}<br>
                                        Category: ${product.category?.name || 'N/A'}<br>
                                        Tags: ${product.tags?.map(tag => tag.name).join(', ') || 'N/A'}
                                    </small>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                productsList.innerHTML += productCard;
            });
        }

        // Search products
        function searchProducts() {
            if (!checkAuth()) return;

            const token = localStorage.getItem('token');
            const searchTerm = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const tag = document.getElementById('tagFilter').value;

            let url = `${API_BASE_URL}/products/?search=${searchTerm}`;
            if (category) url += `&category=${category}`;
            if (tag) url += `&tags=${tag}`;

            fetch(url, {
                headers: {
                    'Authorization': `Token ${token}`
                }
            })
            .then(response => {
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/product/login/';
                    return;
                }
                return response.json();
            })
            .then(products => {
                if (products) displayProducts(products);
            })
            .catch(error => console.error('Error searching products:', error));
        }

        // Add new product
        async function addProduct() {
            if (!checkAuth()) return;

            const token = localStorage.getItem('token');
            const title = document.getElementById('productTitle').value;
            const description = document.getElementById('productDescription').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const categorySelect = document.getElementById('productCategory');
            const categoryName = categorySelect.options[categorySelect.selectedIndex].text;
            const tagSelect = document.getElementById('productTags');
            const tagNames = Array.from(tagSelect.selectedOptions).map(option => option.text);

            try {
                const response = await fetch(`${API_BASE_URL}/products/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        price,
                        category: { name: categoryName },
                        tags: tagNames.map(name => ({ name }))
                    })
                });

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/product/login/';
                    return;
                }

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addProductModal'));
                    modal.hide();
                    fetchProducts();
                } else {
                    const errorData = await response.json();
                    let errorMessage = 'Error adding product:\n';
                    for (const [field, errors] of Object.entries(errorData)) {
                        errorMessage += `${field}: ${errors.join(', ')}\n`;
                    }
                    alert(errorMessage);
                }
            } catch (error) {
                console.error('Error adding product:', error);
                alert('Error adding product. Please try again.');
            }
        }

        // Load categories and tags for filters
        async function loadFilters() {
            if (!checkAuth()) return;

            const token = localStorage.getItem('token');
            try {
                const [categoriesResponse, tagsResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/categories/`, {
                        headers: {
                            'Authorization': `Token ${token}`
                        }
                    }),
                    fetch(`${API_BASE_URL}/tags/`, {
                        headers: {
                            'Authorization': `Token ${token}`
                        }
                    })
                ]);

                if (categoriesResponse.status === 401 || tagsResponse.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/api/product/login/';
                    return;
                }

                const categories = await categoriesResponse.json();
                const tags = await tagsResponse.json();

                // Populate category filter
                const categoryFilter = document.getElementById('categoryFilter');
                categoryFilter.innerHTML = '<option value="">All Categories</option>';
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    categoryFilter.appendChild(option);
                });

                // Populate tag filter
                const tagFilter = document.getElementById('tagFilter');
                tagFilter.innerHTML = '<option value="">All Tags</option>';
                tags.forEach(tag => {
                    const option = document.createElement('option');
                    option.value = tag.id;
                    option.textContent = tag.name;
                    tagFilter.appendChild(option);
                });

                // Also populate the add product form selects
                document.getElementById('productCategory').innerHTML = categoryFilter.innerHTML;
                document.getElementById('productTags').innerHTML = tagFilter.innerHTML;
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) {
                fetchProducts();
                loadFilters();
            }
        });
    </script>
</body>
</html>
