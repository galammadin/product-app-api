<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Page</h1>
        <p>This is a test page to check if the login and redirection are working properly.</p>

        <div class="mt-4">
            <h3>Current URL: <span id="currentUrl"></span></h3>
            <h3>Token: <span id="tokenStatus"></span></h3>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary" onclick="goToLogin()">Go to Login</button>
            <button class="btn btn-success" onclick="goToFrontend()">Go to Frontend</button>
            <button class="btn btn-danger" onclick="clearToken()">Clear Token</button>
        </div>
    </div>

    <script>
        // Display current URL
        document.getElementById('currentUrl').textContent = window.location.href;

        // Check if token exists
        const token = localStorage.getItem('token');
        document.getElementById('tokenStatus').textContent = token ? 'Token exists' : 'No token';

        // Functions
        function goToLogin() {
            window.location.href = '/api/product/login/';
        }

        function goToFrontend() {
            window.location.href = '/api/product/frontend/';
        }

        function clearToken() {
            localStorage.removeItem('token');
            document.getElementById('tokenStatus').textContent = 'No token';
        }
    </script>
</body>
</html>
